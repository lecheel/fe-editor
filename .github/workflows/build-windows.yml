name: Windows Build

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "master" ]

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
        
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-pkgconf
            mingw-w64-x86_64-notcurses
            mingw-w64-x86_64-libgit2

      - name: Configure CMake
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build Project
        run: cmake --build build

      - name: Copy DLLs to Build Folder
        run: cp /mingw64/bin/*.dll build/

      - name: Package Windows Zip
        run: |
          mkdir -p dist/fe
          cp build/fe.exe dist/fe/
          cp build/*.dll dist/fe/
          cd dist
          cmake -E tar cf ../fe-windows.zip --format=zip fe

      # 1. Upload as an Artifact (for normal branch pushes / PRs)
      - name: Upload Windows Package as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: fe-windows
          path: fe-windows.zip
          retention-days: 14

      # 2. Create an Official GitHub Release (ONLY when a tag is pushed)
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: Release ${{ github.ref_name }}
          body: "Automated Windows build for ${{ github.ref_name }}. Extract the zip and run fe.exe."
          files: fe-windows.zip